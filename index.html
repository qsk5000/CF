<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>بوابة ولي الأمر — Mizan Academy IQ</title>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
:root{
  --bg:#F6F4EF;
  --card:#FFFFFF;
  --line:#E8E3D8;
  --teal:#0E7C6B;
  --teal-deep:#0A5C4F;
  --teal-soft:#E3F2EE;
  --ink:#1E2A2D;
  --muted:#7A8783;
  --faint:#B7C0BC;
  --green:#1D8A5A; --greenBg:#E5F5EB;
  --amber:#B4790C; --amberBg:#FBF0DA;
  --red:#C4392B;   --redBg:#FBE9E6;
  --r-sm:10px;--r:16px;--r-lg:22px;--r-xl:28px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--faint);border-radius:4px;}

/* TOAST */
#toastShelf{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(380px,92vw);}
.toast{padding:14px 18px;border-radius:var(--r);font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:10px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.12);background:var(--card);border:1px solid var(--line);}
.toast.s{color:var(--teal-deep);}
.toast.e{color:var(--red);}
.toast.w{color:var(--amber);}

/* LOADER */
#gLoader{display:none;position:fixed;inset:0;background:rgba(246,244,239,.92);z-index:9998;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#gLoader.on{display:flex;}
.loader-ring{width:46px;height:46px;border:4px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#gLoaderMsg{font-weight:700;color:var(--muted);font-size:.9rem;}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{width:100%;max-width:380px;text-align:center;}
.login-emblem{width:68px;height:68px;margin:0 auto 20px;background:var(--teal);border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(14,124,107,.28);}
.login-emblem i{font-size:1.7rem;color:#fff;}
.login-box h1{font-size:1.4rem;font-weight:900;margin-bottom:6px;color:var(--ink);}
.login-box p{color:var(--muted);font-size:.87rem;margin-bottom:28px;}
.login-box input{width:100%;padding:17px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);color:var(--ink);font-family:'Cairo';font-weight:800;font-size:1.15rem;text-align:center;letter-spacing:2px;outline:none;margin-bottom:14px;}
.login-box input:focus{border-color:var(--teal);}
.login-box input::placeholder{letter-spacing:0;font-weight:600;color:var(--faint);font-size:.92rem;}
.btn-teal{width:100%;padding:17px;border-radius:var(--r);background:var(--teal);color:#fff;font-family:'Cairo';font-weight:900;font-size:1rem;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(14,124,107,.25);}
.btn-teal:active{transform:scale(.98);}
.quick-chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px dashed var(--line);color:var(--muted);font-family:'Cairo';font-weight:700;font-size:.82rem;padding:10px 18px;border-radius:20px;cursor:pointer;margin-top:16px;}
.login-help{color:var(--faint);font-size:.78rem;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:6px;}

/* APP */
#app{display:none;}
#app.on{display:block;}
.topbar{position:sticky;top:0;z-index:100;background:rgba(246,244,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;min-height:58px;}
.topbar-back{background:var(--card);border:1px solid var(--line);width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--teal);flex-shrink:0;}
.topbar-back.hidden{visibility:hidden;}
.topbar-title{font-weight:900;font-size:1rem;flex:1;}
.btn-logout{background:transparent;border:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:6px;}

.wrap{max-width:600px;margin:0 auto;padding:18px 16px 60px;}
.screen{display:none;}
.screen.on{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ── HOME: student summary card ── */
.summary-card{background:var(--teal);border-radius:var(--r-xl);padding:24px 22px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;}
.summary-card::after{content:'';position:absolute;left:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);}
.summary-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;position:relative;z-index:1;}
.summary-avatar{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;flex-shrink:0;}
.summary-name{font-size:1.1rem;font-weight:900;}
.summary-code{font-size:.76rem;opacity:.75;font-weight:600;margin-top:2px;}
.summary-verdict{position:relative;z-index:1;font-size:.85rem;font-weight:600;opacity:.95;background:rgba(255,255,255,.12);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;}
.summary-verdict .letter{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;flex-shrink:0;}

/* Quick stat chips row on home */
.chip-row{display:flex;gap:9px;margin-bottom:22px;}
.chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 8px;text-align:center;}
.chip-val{font-size:1.15rem;font-weight:900;color:var(--ink);}
.chip-lbl{font-size:.68rem;color:var(--muted);font-weight:700;margin-top:3px;}

/* Menu list group (iOS settings style) */
.menu-label{font-size:.78rem;font-weight:800;color:var(--muted);margin:0 4px 8px;}
.menu-group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:22px;}
.menu-row{display:flex;align-items:center;gap:14px;padding:16px 16px;cursor:pointer;border-bottom:1px solid var(--line);}
.menu-row:last-child{border-bottom:none;}
.menu-row:active{background:var(--teal-soft);}
.menu-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.menu-body{flex:1;min-width:0;}
.menu-title{font-weight:800;font-size:.93rem;color:var(--ink);}
.menu-sub{font-size:.76rem;color:var(--muted);font-weight:600;margin-top:2px;}
.menu-chevron{color:var(--faint);font-size:.85rem;}

/* ── LIST SCREENS ── */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-chip{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:'Cairo';font-weight:700;font-size:.8rem;cursor:pointer;}
.filter-chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}

.list-group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;}
.list-row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.list-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:.88rem;flex-shrink:0;}
.list-body{flex:1;min-width:0;}
.list-title{font-weight:800;font-size:.9rem;color:var(--ink);}
.list-sub{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:2px;}
.list-value{padding:6px 14px;border-radius:20px;font-weight:900;font-size:.86rem;white-space:nowrap;flex-shrink:0;}
.list-value.hi{background:var(--greenBg);color:var(--green);}
.list-value.mid{background:var(--amberBg);color:var(--amber);}
.list-value.lo{background:var(--redBg);color:var(--red);}
.list-tag{padding:4px 11px;border-radius:14px;font-size:.68rem;font-weight:800;flex-shrink:0;}
.list-tag.done{background:var(--greenBg);color:var(--green);}
.list-tag.pending{background:var(--amberBg);color:var(--amber);}
.list-tag.missed{background:var(--redBg);color:var(--red);}

.group-header{font-size:.76rem;font-weight:800;color:var(--muted);margin:20px 4px 8px;}
.group-header:first-child{margin-top:0;}

.comment-note{background:var(--teal-soft);border-radius:var(--r-sm);padding:11px 14px;margin:0 0 14px;font-size:.79rem;color:var(--teal-deep);font-weight:600;}
.comment-note b{font-weight:900;}

/* Attendance ring on its screen */
.ring-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;display:flex;align-items:center;gap:18px;margin-bottom:20px;}
.ring-wrap{position:relative;width:76px;height:76px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8;}
.ring-fill{fill:none;stroke:var(--teal);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;color:var(--ink);}
.ring-txt b{font-size:.92rem;color:var(--ink);display:block;margin-bottom:3px;}
.ring-txt span{font-size:.78rem;color:var(--muted);font-weight:600;}

.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);}
.empty i{font-size:1.7rem;margin-bottom:10px;display:block;color:var(--faint);}
.empty p{font-size:.85rem;font-weight:600;}
</style>
</head>
<body>

<div id="toastShelf"></div>
<div id="gLoader"><div class="loader-ring"></div><div id="gLoaderMsg">جاري التحميل...</div></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-emblem"><i class="fas fa-user-shield"></i></div>
    <h1>بوابة ولي الأمر</h1>
    <p>أدخل كود ابنك أو بنتك لعرض تقريره الدراسي</p>
    <input id="codeIn" type="text" placeholder="كود الطالب" autocomplete="off"
      oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-teal" onclick="doLogin()"><i class="fas fa-arrow-left"></i> عرض التقرير</button>
    <div style="text-align:center">
      <button class="quick-chip" id="quickChip" style="display:none" onclick="doLogin()">
        <i class="fas fa-history"></i><span id="quickChipTxt"></span>
      </button>
    </div>
    <div class="login-help"><i class="fas fa-lock"></i> نفس كود دخول ابنكم للبوابة الطلابية</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-back hidden" id="backBtn" onclick="goHome()"><i class="fas fa-arrow-right"></i></div>
    <div class="topbar-title" id="topTitle">الميزان</div>
    <button class="btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
  </div>

  <div class="wrap">

    <!-- ══ HOME SCREEN: student card + menu ══ -->
    <div class="screen on" id="screen-home">
      <div class="summary-card">
        <div class="summary-top">
          <div class="summary-avatar" id="stAvatar"></div>
          <div>
            <div class="summary-name" id="stName"></div>
            <div class="summary-code" id="stCode"></div>
          </div>
        </div>
        <div class="summary-verdict">
          <div class="letter" id="verdictLetter"></div>
          <div id="verdictSentence"></div>
        </div>
      </div>

      <div class="chip-row">
        <div class="chip"><div class="chip-val" id="statAvg">—</div><div class="chip-lbl">المعدل العام</div></div>
        <div class="chip"><div class="chip-val" id="statAtt">—</div><div class="chip-lbl">نسبة الحضور</div></div>
        <div class="chip"><div class="chip-val" id="statExams">—</div><div class="chip-lbl">اختبارات</div></div>
      </div>

      <div class="menu-label">تفاصيل التقرير</div>
      <div class="menu-group">
        <div class="menu-row" onclick="openScreen('results')">
          <div class="menu-icon" style="background:var(--teal-soft);color:var(--teal)"><i class="fas fa-file-alt"></i></div>
          <div class="menu-body">
            <div class="menu-title">نتائج الاختبارات</div>
            <div class="menu-sub" id="menuResultsSub">—</div>
          </div>
          <i class="fas fa-chevron-left menu-chevron"></i>
        </div>
        <div class="menu-row" onclick="openScreen('attendance')">
          <div class="menu-icon" style="background:var(--teal-soft);color:var(--teal)"><i class="fas fa-qrcode"></i></div>
          <div class="menu-body">
            <div class="menu-title">سجل الحضور</div>
            <div class="menu-sub" id="menuAttSub">—</div>
          </div>
          <i class="fas fa-chevron-left menu-chevron"></i>
        </div>
        <div class="menu-row" onclick="openScreen('grades')">
          <div class="menu-icon" style="background:var(--teal-soft);color:var(--teal)"><i class="fas fa-chart-bar"></i></div>
          <div class="menu-body">
            <div class="menu-title">الدرجات اليومية</div>
            <div class="menu-sub" id="menuGradesSub">—</div>
          </div>
          <i class="fas fa-chevron-left menu-chevron"></i>
        </div>
      </div>
    </div>

    <!-- ══ RESULTS SCREEN ══ -->
    <div class="screen" id="screen-results">
      <div id="resultsList"></div>
    </div>

    <!-- ══ ATTENDANCE SCREEN ══ -->
    <div class="screen" id="screen-attendance">
      <div class="ring-card">
        <div class="ring-wrap">
          <svg width="76" height="76" viewBox="0 0 76 76">
            <circle class="ring-bg" cx="38" cy="38" r="32"/>
            <circle class="ring-fill" id="attRingFill" cx="38" cy="38" r="32" stroke-dasharray="201" stroke-dashoffset="201"/>
          </svg>
          <div class="ring-num" id="attRingNum">0%</div>
        </div>
        <div class="ring-txt"><b id="attSummaryB"></b><span id="attSummaryP"></span></div>
      </div>
      <div id="missGroup"></div>
      <div id="attList"></div>
    </div>

    <!-- ══ GRADES SCREEN ══ -->
    <div class="screen" id="screen-grades">
      <div class="filter-row" id="gradeFilters">
        <button class="filter-chip on" data-f="all">الكل</button>
        <button class="filter-chip" data-f="hi">ممتاز</button>
        <button class="filter-chip" data-f="mid">متوسط</button>
        <button class="filter-chip" data-f="lo">ضعيف</button>
      </div>
      <div id="gradesList"></div>
    </div>

  </div>
</div>

<script>
/* ── Firebase ── */
firebase.initializeApp({
  apiKey:     "AIzaSyCL7hbXqwzErzrshZOXjszErbS4t9LSWs8",
  authDomain: "amimizaniq.firebaseapp.com",
  projectId:  "amimizaniq",
  appId:      "1:644598552588:web:fb226a15704bb65c377629"
});
const db = firebase.firestore();
firebase.auth().signInAnonymously().catch(e => console.error('Auth error:', e));
const authReady = new Promise(resolve => {
  firebase.auth().onAuthStateChanged(user => { if (user) resolve(user); });
});

let S = { code:null, student:null, results:[], attendance:[], exams:[] };
let allGrades = [];

const $ = id => document.getElementById(id);
const esc = s => (s||'').toString().replace(/</g,'&lt;').replace(/>/g,'&gt;');

function loader(msg=''){ $('gLoaderMsg').textContent=msg; $('gLoader').classList.add('on'); }
function unloader(){ $('gLoader').classList.remove('on'); }

function toast(msg,type='s',dur=3200){
  const icons={s:'fa-check-circle',e:'fa-times-circle',w:'fa-exclamation-triangle'};
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<i class="fas ${icons[type]}"></i><span>${esc(msg)}</span>`;
  $('toastShelf').appendChild(el);
  setTimeout(()=>el.remove(),dur);
}

function parsePct(g){
  const s=(g??'').toString();
  if(s.includes('/')){const[a,b]=s.split('/');return(parseFloat(a)/parseFloat(b))*100;}
  return parseFloat(s)||0;
}
function scoreClass(p){ return p>=75?'hi':p>=50?'mid':'lo'; }

function gradeInfo(avg){
  if(avg>=95) return {letter:'A+',label:'متميز استثنائي'};
  if(avg>=90) return {letter:'A', label:'ممتاز'};
  if(avg>=80) return {letter:'B+',label:'جيد جداً مرتفع'};
  if(avg>=70) return {letter:'B', label:'جيد جداً'};
  if(avg>=60) return {letter:'C+',label:'جيد'};
  if(avg>=50) return {letter:'C', label:'مقبول'};
  if(avg>=40) return {letter:'D', label:'ضعيف'};
  return               {letter:'F', label:'ضعيف جداً'};
}
function verdictSentence(avg, attRate, hasData){
  if(!hasData) return 'ماكو بيانات كافية بعد لتقييم مستوى الطالب.';
  if(avg>=85 && attRate>=80) return 'مستوى ممتاز مع التزام جيد بالحضور — استمروا بنفس الدعم.';
  if(avg>=85) return 'مستوى دراسي ممتاز، لكن الالتزام بالحضور يحتاج تحسين.';
  if(avg>=60) return 'المستوى جيد وقابل للتطور، متابعتكم البسيطة راح تساعده يرتقي أكثر.';
  if(attRate<50 && avg<60) return 'المستوى والحضور بحاجة اهتمام فوري — يُفضّل التواصل مع الأستاذ.';
  return 'المستوى يحتاج اهتمام إضافي، ننصح بمتابعة أقرب مع الطالب.';
}

/* ── Screen navigation ── */
const TITLES = { home:'الميزان', results:'نتائج الاختبارات', attendance:'سجل الحضور', grades:'الدرجات اليومية' };
function openScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(`screen-${name}`).classList.add('on');
  $('topTitle').textContent = TITLES[name];
  $('backBtn').classList.toggle('hidden', name==='home');
  window.scrollTo(0,0);
}
function goHome(){ openScreen('home'); }

/* ── Login ── */
window.addEventListener('DOMContentLoaded', ()=>{
  const last=localStorage.getItem('mizan_parent_last_code');
  if(last){
    $('codeIn').value=last;
    $('quickChip').style.display='inline-flex';
    $('quickChipTxt').textContent=`عرض تقرير: ${last}`;
  }
});

async function doLogin(){
  const code=$('codeIn').value.trim().toUpperCase();
  if(!code){ toast('يرجى إدخال كود الطالب','w'); return; }
  loader('التحقق من الكود...');
  try{
    await authReady;
    const doc=await db.collection('StudentPortal').doc(code).get();
    if(!doc.exists){ toast('الكود غير مسجّل في النظام','e'); unloader(); return; }
    S.code=code; S.student=doc.data();
    localStorage.setItem('mizan_parent_last_code',code);
    await boot();
  }catch(e){ toast('خطأ في الاتصال بالخادم','e'); }
  unloader();
}

function doLogout(){
  S={code:null,student:null,results:[],attendance:[],exams:[]};
  $('loginScreen').style.display='flex';
  $('app').classList.remove('on');
  $('codeIn').value='';
  goHome();
  toast('تم تسجيل الخروج','s');
}

/* ── Boot ── */
async function boot(){
  loader('جاري تحميل بيانات الطالب...');
  try{
    const [resSnap, attSnap, examSnap] = await Promise.all([
      db.collection('Results').where('studentCode','==',S.code).get(),
      db.collection('Attendance').where('studentCode','==',S.code).get(),
      db.collection('Exams').where('studentCode','==',S.code).get()
    ]);
    S.results = resSnap.docs.map(d=>({id:d.id, ...d.data()}));
    S.attendance = attSnap.docs.map(d=>d.data());
    S.exams = examSnap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){
    console.error(e);
    toast('تعذر تحميل بعض البيانات','w');
  }
  render();
}

function render(){
  const s=S.student;
  const init=(s.name||'ط').charAt(0);
  $('stAvatar').textContent=init;
  $('stName').textContent=s.name||'—';
  $('stCode').textContent='كود: '+S.code;

  const grades=s.dailyGrades||[];
  allGrades=grades;
  const scores=grades.map(g=>parsePct(g.grade));
  const dailyAvg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length):0;

  const resultScores=S.results.map(r=> r.graded ? (r.finalGrade ?? r.autoGrade) : r.autoGrade);
  const resAvg=resultScores.length?(resultScores.reduce((a,b)=>a+b,0)/resultScores.length):0;

  const overallAvg = scores.length ? dailyAvg : resAvg;
  const hasData = scores.length>0 || resultScores.length>0;

  const examsPast=S.exams.filter(e=>e.start && e.start.toDate()<=new Date());
  const attRate=examsPast.length?Math.round((S.attendance.length/examsPast.length)*100):(S.attendance.length?100:0);

  const gi=gradeInfo(overallAvg);
  $('verdictLetter').textContent = hasData ? gi.letter : '—';
  $('verdictSentence').textContent = verdictSentence(overallAvg, attRate, hasData);

  $('statAvg').textContent = hasData ? overallAvg.toFixed(0)+'%' : '—';
  $('statAtt').textContent = examsPast.length ? attRate+'%' : '—';
  $('statExams').textContent = S.results.length;

  $('menuResultsSub').textContent = S.results.length ? `${S.results.length} نتيجة مسجلة` : 'لا توجد نتائج بعد';
  $('menuAttSub').textContent = examsPast.length ? `نسبة الحضور ${attRate}%` : 'لا توجد بيانات بعد';
  $('menuGradesSub').textContent = grades.length ? `${grades.length} درجة مسجلة` : 'لا توجد درجات بعد';

  renderResults();
  renderAttendance(examsPast, attRate);
  bindGradeFilters();
  renderGrades('all');

  $('loginScreen').style.display='none';
  $('app').classList.add('on');
  goHome();
  toast(`تم تحميل تقرير ${(s.name||'').split(' ')[0]||''}`,'s');
}

/* ── Results list, grouped by graded/pending ── */
function renderResults(){
  if(!S.results.length){
    $('resultsList').innerHTML='<div class="empty"><i class="fas fa-inbox"></i><p>لا توجد نتائج اختبارات مسجلة بعد</p></div>';
    return;
  }
  const sorted=[...S.results].sort((a,b)=>{
    const ta=a.submittedAt&&a.submittedAt.toDate?a.submittedAt.toDate():0;
    const tb=b.submittedAt&&b.submittedAt.toDate?b.submittedAt.toDate():0;
    return tb-ta;
  });

  let html='<div class="list-group">';
  html += sorted.map(r=>{
    const isGraded = r.graded===true;
    const score = isGraded ? (r.finalGrade ?? r.autoGrade) : r.autoGrade;
    const cls = scoreClass(score);
    const dateStr = r.submittedAt&&r.submittedAt.toDate
      ? r.submittedAt.toDate().toLocaleDateString('ar-IQ',{day:'numeric',month:'short'})
      : '—';
    return `<div class="list-row">
      <div class="list-icon" style="background:${cls==='hi'?'var(--greenBg)':cls==='mid'?'var(--amberBg)':'var(--redBg)'};color:${cls==='hi'?'var(--green)':cls==='mid'?'var(--amber)':'var(--red)'}"><i class="fas fa-book"></i></div>
      <div class="list-body">
        <div class="list-title">${esc(r.subject)}</div>
        <div class="list-sub">${dateStr} · ${isGraded?'مدقَّق نهائياً':'بانتظار التدقيق'}</div>
      </div>
      <div class="list-value ${cls}">${score}%</div>
    </div>`;
  }).join('');
  html += '</div>';

  const comments = sorted.map(r=> r.graded ? (r.answers||[]).find(a=>a.teacherComment) : null).filter(Boolean);
  if(comments.length){
    html += '<div class="group-header">ملاحظات المدرّسين</div>';
    comments.forEach(c=>{ html += `<div class="comment-note">${esc(c.teacherComment)}</div>`; });
  }

  $('resultsList').innerHTML = html;
}

/* ── Attendance ── */
function renderAttendance(examsPast, rate){
  const circ=201;
  const offset = circ - (rate/100)*circ;
  $('attRingFill').style.strokeDasharray = circ;
  $('attRingFill').style.strokeDashoffset = offset;
  $('attRingNum').textContent = rate+'%';

  if(examsPast.length){
    $('attSummaryB').textContent = `سجّل حضور ${S.attendance.length} من ${examsPast.length} اختبار`;
    $('attSummaryP').textContent = rate>=75 ? 'التزام جيد بالحضور' : rate>=50 ? 'الالتزام متوسط' : 'الالتزام ضعيف، يُنصح بالمتابعة';
  } else {
    $('attSummaryB').textContent = 'لا توجد اختبارات سابقة بعد';
    $('attSummaryP').textContent = '';
  }

  const attendedIds = new Set(S.attendance.map(a=>a.examId).filter(Boolean));
  const missed = examsPast.filter(e=>!attendedIds.has(e.id));

  if(missed.length){
    let mHtml = '<div class="group-header">اختبارات لم يُسجَّل لها حضور</div><div class="list-group">';
    mHtml += missed.map(e=>{
      const dt = e.start&&e.start.toDate ? e.start.toDate().toLocaleDateString('ar-IQ',{day:'numeric',month:'short'}) : '';
      return `<div class="list-row">
        <div class="list-icon" style="background:var(--redBg);color:var(--red)"><i class="fas fa-exclamation"></i></div>
        <div class="list-body"><div class="list-title">${esc(e.subject||'اختبار')}</div><div class="list-sub">${dt}</div></div>
        <div class="list-tag missed">غياب</div>
      </div>`;
    }).join('');
    mHtml += '</div>';
    $('missGroup').innerHTML = mHtml;
  } else {
    $('missGroup').innerHTML = '';
  }

  if(!S.attendance.length){
    $('attList').innerHTML = missed.length ? '' : '<div class="empty"><i class="fas fa-inbox"></i><p>لا يوجد سجل حضور بعد</p></div>';
    return;
  }

  const sortedAtt=[...S.attendance].sort((a,b)=>{
    const ta=a.timestamp&&a.timestamp.toDate?a.timestamp.toDate():0;
    const tb=b.timestamp&&b.timestamp.toDate?b.timestamp.toDate():0;
    return tb-ta;
  });

  let html = '<div class="group-header">سجل الحضور</div><div class="list-group">';
  html += sortedAtt.map(r=>{
    const t=r.timestamp&&r.timestamp.toDate
      ? r.timestamp.toDate().toLocaleDateString('ar-IQ',{day:'numeric',month:'short'})
      : '—';
    return `<div class="list-row">
      <div class="list-icon" style="background:var(--greenBg);color:var(--green)"><i class="fas fa-check"></i></div>
      <div class="list-body"><div class="list-title">${esc(r.subject||'حضور')}</div><div class="list-sub">${t}</div></div>
      <div class="list-tag done">حضر</div>
    </div>`;
  }).join('');
  html += '</div>';
  $('attList').innerHTML = html;
}

/* ── Daily grades ── */
function bindGradeFilters(){
  document.querySelectorAll('#gradeFilters .filter-chip').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('#gradeFilters .filter-chip').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      renderGrades(btn.dataset.f);
    };
  });
}
function renderGrades(filter){
  const sorted=[...allGrades].reverse().filter(g=>{
    if(filter==='all') return true;
    return scoreClass(parsePct(g.grade))===filter;
  });
  if(!sorted.length){
    $('gradesList').innerHTML='<div class="empty"><i class="fas fa-inbox"></i><p>لا توجد درجات ضمن هذا التصنيف</p></div>';
    return;
  }
  let html='<div class="list-group">';
  html += sorted.map(g=>{
    const cl=scoreClass(parsePct(g.grade));
    return `<div class="list-row">
      <div class="list-icon" style="background:${cl==='hi'?'var(--greenBg)':cl==='mid'?'var(--amberBg)':'var(--redBg)'};color:${cl==='hi'?'var(--green)':cl==='mid'?'var(--amber)':'var(--red)'}"><i class="fas fa-pen"></i></div>
      <div class="list-body"><div class="list-title">${esc(g.subject)}</div><div class="list-sub">${esc(g.date)}</div></div>
      <div class="list-value ${cl}">${esc(g.grade)}</div>
    </div>`;
  }).join('');
  html += '</div>';
  $('gradesList').innerHTML = html;
}
</script>
</body>
</html>
